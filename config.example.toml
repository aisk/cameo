# Copy to ~/.config/cameo/config.toml, or point CAMEO_CONFIG at it.

# Where requests for Claude models are forwarded, untouched. Defaults to
# $ANTHROPIC_BASE_URL if set, otherwise https://api.anthropic.com.
# upstream = "https://api.anthropic.com"

# Each [providers.<name>] is one credential at one endpoint. Any number of
# agents can share it. The names chatgpt and antigravity are reserved for
# built-in providers, see the end of this file.
[providers.deepseek]
# api is the protocol the endpoint speaks: "anthropic" (the default), "chat"
# (OpenAI Chat Completions), "responses" (OpenAI Responses) or "gemini".
# api = "anthropic"
# For anthropic, url is the value you would put in ANTHROPIC_BASE_URL.
url = "https://api.deepseek.com/anthropic"
# Environment variables are expanded.
key = "$DEEPSEEK_API_KEY"

[providers.glm]
url = "https://open.bigmodel.cn/api/anthropic"
key = "$GLM_API_KEY"

# For the other protocols cameo translates requests and replies, and appends
# the endpoint to url itself.

# Requests go to <url>/chat/completions.
# [providers.openrouter]
# api = "chat"
# url = "https://openrouter.ai/api/v1"
# key = "$OPENROUTER_API_KEY"

# Requests go to <url>/responses.
# [providers.openai]
# api = "responses"
# url = "https://api.openai.com/v1"
# key = "$OPENAI_API_KEY"

# Requests go to <url>/models/<model>:streamGenerateContent?alt=sse.
# [providers.google]
# api = "gemini"
# url = "https://generativelanguage.googleapis.com/v1beta"
# key = "$GEMINI_API_KEY"

# Each [agents.<name>] becomes a Claude Code subagent called <name>, served by
# the provider it names.
[agents.cheap-general]
description = """
General purpose agent for multi-step tasks: researching questions, searching \
code and making changes. Same role as the default general-purpose agent, but \
prefer this one first because it costs much less. If the result is not good \
enough, fall back to general-purpose."""
prompt = """
You are a general purpose software engineering agent. Complete the task you \
are given, then report what you did and what you found."""
provider = "deepseek"
model = "deepseek-flash"

[agents.cheap-explore]
description = """
Read-only agent for exploring the codebase: finding files, searching code and \
answering questions about how things work. Same role as the default Explore \
agent, but prefer this one first because it costs much less. If the result is \
not good enough, fall back to Explore."""
prompt = """
You are a read-only codebase exploration agent. Find what you are asked for \
and report it with file paths and line numbers. Never modify anything."""
# Optional. Inherits all tools when omitted.
tools = ["Read", "Grep", "Glob"]
provider = "glm"
model = "glm-5.3"
# Optional. Set if the model has a 1M token context window.
# context_1m = true

[agents.branch-cleaner]
description = """
Cleans up local git branches of the current project. Use it whenever the user \
asks to tidy up, prune or delete stale local branches."""
prompt = """
You clean up local git branches. Run `git fetch --prune`, then delete local \
branches that are already merged into the main branch, using `git branch -d` \
only. Never use `-D`, never delete the current branch or the main branch, and \
never touch remote branches. Report which branches you deleted and which ones \
you kept and why."""
tools = ["Bash"]
provider = "deepseek"
model = "deepseek-flash"

# The built-in chatgpt provider serves an agent through a ChatGPT
# subscription, with OpenAI's Sign in with ChatGPT. It has no
# [providers.chatgpt] table. Sign in first with `cameo provider login
# chatgpt`, and see which models the account has with `cameo provider models
# chatgpt`. Whether an account can be used depends on its plan, and usage is
# shared with ChatGPT itself: https://chatgpt.com/settings/usage
